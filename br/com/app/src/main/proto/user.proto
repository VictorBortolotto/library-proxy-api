syntax = "proto3";

package user;

service UserService {

  rpc CreateUser(UserRequest) returns (UserResponse);
  rpc ValidadeUser(UserLoginRequest) returns (UserLoginResponse);

}

message UserRequest {
  string email = 1;
  string password = 2;
}

message UserLoginRequest {
  string email = 1;
  string password = 2;
  int32 user_id = 3;
}

message UserResponse {
  int32 user_id = 1;
  string message = 2;
}

message UserLoginResponse {
  int32 user_id = 1;
  bool is_valid_login = 2;
}