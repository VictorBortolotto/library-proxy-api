syntax = "proto3";

package book;

import "google/protobuf/empty.proto";

service BookService {

  rpc CreateBook(BookDto) returns (BookResponseDto);

  rpc UpdateBook(BookRequest) returns (BookResponseDto);

  rpc DeleteBook(BookIdRequest) returns (BookDeleteResponse);

  rpc FindBookById(BookIdRequest) returns (BookResponseDto);

  rpc FindAllBook(google.protobuf.Empty) returns (BookListResponse);
}

message BookRequest {
  int32 id = 1;
  BookDto book = 2;
}

message BookIdRequest {
  int32 id = 1;
}

message BookDto {
  string title = 1;
  string description = 2;
  int32 quantity = 3;
}

message BookResponseDto {
  Book data = 1;
  string message = 2;
}

message BookListResponse {
  repeated Book data = 1;
  string message = 2;
}

message Book {
  int32 id = 1;
  string title = 2;
  string description = 3;
  int32 quantity = 4;
}

message BookDeleteResponse {
  string message = 1;
}