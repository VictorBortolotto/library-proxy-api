tags:
  - Book

summary: Delete book

parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
    description: Book ID

responses:
  200:
    description: Book deleted with success.
    schema:
      type: object
      properties:
        message:
          type: string
          example: Book deleted with success.
  404:
    description: Book not found.
    schema:
      type: object
      properties:
        message:
          type: string
          example: Book not found.
  500:
    description: Error to delete book.
    schema:
      type: object
      properties:
        message:
          type: string
          example: Error to delete book.