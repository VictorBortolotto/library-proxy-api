tags:
  - Client

summary: Create client

consumes:
  - application/json

parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
    description: Client ID
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        book_id:
          type: integer
          example: 1
        return_date:
          type: string
          example: 2026-01-09 00:00:00
        is_book_already_returned:
          type: boolean
          example: true
        returned_quantity:
          type: integer
          example: 1

responses:
  200:
    description: Book returned successfully.
    schema:
      type: object
      properties:
        message:
          type: string
          example: Book returned successfully.

  404:
    description: Book or loan not found.
    schema:
      type: object
      properties:
        message:
          type: string
          example: Book or loan not found.
  409:
    description: The quantity of returned books is greater than the quantity of rented books.
    schema:
      type: object
      properties:
        message:
          type: string
          example: The quantity of returned books is greater than the quantity of rented books.
  500:
    description: Error to update book loan data.
    schema:
      type: object
      properties:
        message:
          type: string
          example: Error to update book loan data.